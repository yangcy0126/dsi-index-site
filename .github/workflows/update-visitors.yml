name: Update Visitor Snapshot

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_visitor_snapshot.py"
      - "scripts/build_wdsi_data.py"
      - "tests/test_visitor_regions.py"
      - ".github/workflows/update-visitors.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: visitor-snapshot
  cancel-in-progress: false

jobs:
  refresh-visitors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.public.outputs.needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check visitor region handling
        run: python tests/test_visitor_regions.py

      - name: Refresh visitor snapshot
        run: python scripts/update_visitor_snapshot.py

      - name: Commit and push
        id: commit-and-push
        run: |
          if git diff --quiet -- data/visitor_stats.json; then
            echo "No visitor snapshot changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/visitor_stats.json
            git commit -m "Update visitor snapshot"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort || true
              echo "Push attempt ${attempt} failed; retrying..."
              sleep 5
            done
            echo "Failed to push visitor snapshot after 3 attempts."
            exit 1
          fi

      - name: Check whether the public snapshot needs deployment
        id: public
        env:
          CHANGED: ${{ steps.commit-and-push.outputs.changed }}
        run: |
          needed="$CHANGED"
          if [ "$needed" != "true" ]; then
            needed=$(python scripts/update_visitor_snapshot.py --needs-deploy)
          fi
          echo "Public snapshot needs deployment: $needed"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh-visitors
    if: needs.refresh-visitors.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      publish_ref: main
